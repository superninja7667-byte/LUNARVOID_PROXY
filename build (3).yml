name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the source zip
        run: unzip -q -o lunarvoid-src.zip -d src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      # APK 1: your ORIGINAL old app, untouched, with only your new app screen swapped in.
      - name: Make APK 1 (original app + your page)
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/34.0.0"
          cd /tmp
          cp "$GITHUB_WORKSPACE/src/original/old-app.apk" work.apk
          mkdir -p p/assets
          cp "$GITHUB_WORKSPACE/src/app/src/main/assets/index.html" p/assets/index.html
          zip -q -d work.apk 'META-INF/*' || true
          (cd p && zip -q ../work.apk assets/index.html)
          "$BT/zipalign" -f -p 4 work.apk aligned.apk
          "$BT/apksigner" sign --ks "$GITHUB_WORKSPACE/src/app/lunarvoid.jks" --ks-pass pass:lunarvoid --key-pass pass:lunarvoid --out "$GITHUB_WORKSPACE/1-ORIGINAL-app-with-your-page.apk" aligned.apk
          "$BT/apksigner" verify "$GITHUB_WORKSPACE/1-ORIGINAL-app-with-your-page.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: APK-1-ORIGINAL-app
          path: 1-ORIGINAL-app-with-your-page.apk

      # APK 2: the old engine inside the new Android code.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Make APK 2 (old engine in new Android code)
        continue-on-error: true
        working-directory: src
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: APK-2-NEW-code
          path: src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

# Build workflow is maintained in .github/workflows/build-apk.yml.
